[package]
name = "agente-financiero"
version = "0.1.0"
description = "Analista financiero personal para macOS"
edition = "2021"
rust-version = "1.80"

[lib]
name = "agente_financiero_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-store = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "json"] }
tokio = { version = "1", features = ["time", "sync"] }
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }

# Llavero de macOS. En otros sistemas (solo CI/tests) keyring usa su almacén simulado.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }
[target.'cfg(not(target_os = "macos"))'.dependencies]
keyring = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "test-util", "time"] }
