<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="Stock Analisis">
  <!-- Logo animado: velas que suben una a una y una línea de tendencia que se dibuja encima.
       Todo local (SVG + CSS), sin red. Con "reducir movimiento" se muestra quieto. -->
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#D98B6F"/>
      <stop offset="1" stop-color="#B5603F"/>
    </linearGradient>
    <clipPath id="circulo"><circle cx="120" cy="120" r="110"/></clipPath>
  </defs>
  <style>
    .vela { transform-box: fill-box; transform-origin: 50% 100%; animation: vela 6s cubic-bezier(.2,.8,.2,1) infinite both; }
    .v2 { animation-delay: .15s } .v3 { animation-delay: .3s } .v4 { animation-delay: .45s } .v5 { animation-delay: .6s }
    .linea { stroke-dasharray: 220; stroke-dashoffset: 0; animation: linea 6s ease-in-out infinite both; }
    .punto { transform-box: fill-box; transform-origin: center; animation: punto 6s ease-out infinite both; }
    .halo { transform-box: fill-box; transform-origin: center; animation: halo 6s ease-out infinite both; }
    .rejilla { animation: rejilla 6s linear infinite both; }
    @keyframes vela { 0% { transform: scaleY(0); opacity: 0 } 9% { transform: scaleY(1); opacity: 1 } 86% { transform: scaleY(1); opacity: 1 } 96%, 100% { transform: scaleY(1); opacity: 0 } }
    @keyframes linea { 0%, 16% { stroke-dashoffset: 220; opacity: 1 } 40% { stroke-dashoffset: 0; opacity: 1 } 86% { stroke-dashoffset: 0; opacity: 1 } 96%, 100% { stroke-dashoffset: 0; opacity: 0 } }
    @keyframes punto { 0%, 38% { transform: scale(0) } 44% { transform: scale(1.25) } 50%, 86% { transform: scale(1); opacity: 1 } 96%, 100% { transform: scale(1); opacity: 0 } }
    @keyframes halo { 0%, 44% { transform: scale(.6); opacity: 0 } 50% { opacity: .55 } 70%, 100% { transform: scale(2.6); opacity: 0 } }
    @keyframes rejilla { 0%, 100% { opacity: .1 } 50% { opacity: .2 } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important } .halo { opacity: 0 } }
  </style>

  <circle cx="120" cy="120" r="110" fill="url(#fondo)"/>
  <g clip-path="url(#circulo)" stroke="#FAF9F5" stroke-width="1" class="rejilla">
    <line x1="20" y1="70" x2="220" y2="70"/>
    <line x1="20" y1="110" x2="220" y2="110"/>
    <line x1="20" y1="150" x2="220" y2="150"/>
  </g>

  <g stroke="#FAF9F5" stroke-width="3" stroke-linecap="round">
    <g class="vela v1"><line x1="61" y1="112" x2="61" y2="166"/><rect x="52" y="124" width="18" height="34" rx="3" fill="#FAF9F5"/></g>
    <g class="vela v2"><line x1="93" y1="96" x2="93" y2="150"/><rect x="84" y="106" width="18" height="34" rx="3" fill="#FAF9F5"/></g>
    <g class="vela v3"><line x1="125" y1="102" x2="125" y2="152"/><rect x="117.5" y="112" width="15" height="26" rx="3" fill="none"/></g>
    <g class="vela v4"><line x1="157" y1="70" x2="157" y2="132"/><rect x="148" y="80" width="18" height="42" rx="3" fill="#FAF9F5"/></g>
    <g class="vela v5"><line x1="189" y1="46" x2="189" y2="110"/><rect x="180" y="56" width="18" height="44" rx="3" fill="#FAF9F5"/></g>
  </g>

  <path class="linea" d="M42 150 L61 124 L93 106 L125 138 L157 80 L196 50" fill="none" stroke="#EBDBBC" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle class="halo" cx="196" cy="50" r="9" fill="#EBDBBC"/>
  <circle class="punto" cx="196" cy="50" r="8" fill="#EBDBBC" stroke="#B5603F" stroke-width="3"/>
</svg>
